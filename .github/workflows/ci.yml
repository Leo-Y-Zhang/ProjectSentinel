name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only ever read the checkout. Declared
# explicitly so the workflow keeps its own floor even if the repository
# default token permission is widened later.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      # The gate that gives this repo its point: the book may not print a figure
      # the model does not produce. It runs last so a failure here is unambiguous.
      - name: Verify the book against the model
        run: python verify_book.py
